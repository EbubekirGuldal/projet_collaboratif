# Surcharges de developpement local uniquement (compose les fusionne
# automatiquement avec compose.yaml).

services:
  database:
    # Expose MySQL sur un port aleatoire de l'hote : `docker compose port database 3306`
    ports:
      - "3306"

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
