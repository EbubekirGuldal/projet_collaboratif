; Reglages PHP de l'image applicative (prod).

; --- OPcache : indispensable en prod, le code ne change pas dans une image
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; --- Uploads : l'application accepte des photos de ressources
upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 256M

; --- Erreurs : dans les logs du conteneur, jamais dans la reponse HTTP
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

date.timezone = Europe/Paris
