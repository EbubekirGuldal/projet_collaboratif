# Pipeline CI/CD - Ressources Relationnelles (Symfony 7.3)
# Phases : Build  >  Tests  >  Deploy
#
# A placer dans le depot : .github/workflows/ci.yml
# Le job "deploy" est volontairement desactive tant que le serveur cible
# n'est pas provisionne : decommentez et renseignez les secrets GitHub
# (Settings > Secrets and variables > Actions) pour l'activer.

name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------- BUILD
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, intl, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Cache des dependances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Installation des dependances PHP
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build des assets front (Webpack Encore)
        run: |
          npm ci
          npm run build

  # ----------------------------------------------------------------- TESTS
  tests:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest
    needs: build
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: projet_co_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: test
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/projet_co_test?serverVersion=8.0"
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, intl, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Installation des dependances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build des assets front (Webpack Encore)
        run: |
          npm ci
          npm run build

      - name: Generation des cles JWT (test)
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --env=test || true

      - name: Creation du schema de base de test
        run: php bin/console doctrine:schema:create --env=test

      - name: Execution de la suite de tests
        run: php bin/phpunit

  # ----------------------------------------------------------------- DEPLOY
  # Active uniquement sur la branche master, apres build + tests verts.
  # >>> A CONFIGURER : renseignez les secrets SSH_HOST, SSH_USER, SSH_KEY
  #     puis retirez le "if: false" ci-dessous pour activer le deploiement.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: tests
    if: false   # <-- passez a: github.ref == 'refs/heads/master' une fois le serveur pret
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Deploiement par SSH (rsync)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/ressources-relationnelles
            git pull origin master
            composer install --no-dev --optimize-autoloader
            npm ci && npm run build
            php bin/console doctrine:migrations:migrate --no-interaction
            php bin/console cache:clear --env=prod
            # Rollback : en cas d'echec, restaurer le dump BDD et revenir au tag/commit N-1
