# Pipeline CI/CD - Ressources Relationnelles (Symfony 7.3)
# Phases : Build  >  Tests  >  Deploy
#
# A placer dans le depot : .github/workflows/ci.yml
# Le job "deploy" est volontairement desactive tant que le serveur cible
# n'est pas provisionne : decommentez et renseignez les secrets GitHub
# (Settings > Secrets and variables > Actions) pour l'activer.

name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------- BUILD
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, intl, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Cache des dependances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Installation des dependances PHP
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build des assets front (Webpack Encore)
        run: |
          npm ci
          npm run build

  # ----------------------------------------------------------------- TESTS
  tests:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest
    needs: build
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: projet_co_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: test
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/projet_co_test?serverVersion=8.0"
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, intl, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Installation des dependances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build des assets front (Webpack Encore)
        run: |
          npm ci
          npm run build

      - name: Generation des cles JWT (test)
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --env=test || true

      - name: Creation du schema de base de test
        run: php bin/console doctrine:schema:create --env=test

      - name: Execution de la suite de tests
        run: php bin/phpunit


  # ---------------------------------------------------- DEPLOIEMENT (VALIDATION)
  # Ce job repond a la question "l'environnement de deploiement est-il reellement
  # configure ?" en le montant pour de vrai : il demarre la stack compose, laisse
  # l'entrypoint appliquer les migrations sur une base vide, puis verifie que le
  # schema est en place et que l'application repond. Sans lui, le deploiement ne
  # serait qu'une intention decrite dans un fichier.
  deploy-check:
    name: Validation du deploiement (compose + migrations)
    runs-on: ubuntu-latest
    needs: tests
    env:
      # compose.override.yaml est volontairement exclu : il porte l'outillage de
      # developpement (mailpit, ports exposes), pas la stack a valider.
      COMPOSE: docker compose --env-file .env.ci -f compose.yaml -f compose.ci.yaml
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # Les secrets de cette stack ephemere sont tires au hasard a chaque run :
      # rien de sensible n'a a etre stocke dans le depot ni dans les secrets
      # GitHub pour valider le chemin de deploiement.
      - name: Generation des secrets ephemeres
        run: |
          {
            echo "APP_SECRET=$(openssl rand -hex 16)"
            echo "JWT_PASSPHRASE=$(openssl rand -hex 16)"
            echo "MYSQL_PASSWORD=$(openssl rand -hex 12)"
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 12)"
          } > .env.ci

      - name: Demarrage de la stack
        run: $COMPOSE up -d --build

      # L'entrypoint attend la base, applique les migrations puis lance nginx.
      # On attend donc l'etat "healthy" du HEALTHCHECK, qui ne passe au vert
      # qu'une fois /healthz servi.
      - name: Attente de l application (HEALTHCHECK)
        run: |
          for i in $(seq 1 60); do
            etat=$(docker inspect --format '{{.State.Health.Status}}' "$($COMPOSE ps -q app)" 2>/dev/null || echo inconnu)
            echo "tentative $i : $etat"
            if [ "$etat" = "healthy" ]; then exit 0; fi
            if [ "$etat" = "unhealthy" ]; then exit 1; fi
            sleep 5
          done
          echo "l'application n'est pas devenue saine en 5 minutes" >&2
          exit 1

      - name: Verification HTTP de /healthz
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz)
          echo "GET /healthz -> $code"
          test "$code" = "200"

      # Preuve que la migration initiale reconstruit le schema complet a partir
      # d'une base vide : on compte les tables applicatives effectivement creees.
      - name: Verification du schema applique
        run: |
          $COMPOSE exec -T app php bin/console doctrine:migrations:status --no-ansi
          requete="SELECT COUNT(*) FROM information_schema.tables"
          requete="$requete WHERE table_schema = DATABASE()"
          requete="$requete AND table_name <> 'doctrine_migration_versions'"
          tables=$($COMPOSE exec -T app php bin/console doctrine:query:sql "$requete" --no-ansi | grep -oE '[0-9]+' | tail -1)
          echo "tables applicatives presentes : $tables"
          test "$tables" -ge 13

      - name: Journaux en cas d echec
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Arret de la stack
        if: always()
        run: $COMPOSE down -v

  # ----------------------------------------------------------------- DOCKER
  docker:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: [tests, deploy-check]
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # GHCR n'accepte que des noms d'image en minuscules, or le proprietaire
      # du depot contient des majuscules (EbubekirGuldal).
      - name: Nom de l image en minuscules
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Le driver buildx par defaut du runner ("docker") ne sait pas exporter
      # de cache : type=gha exige le driver docker-container.
      - name: Mise en place de Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au GitHub Container Registry
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # L image est construite a chaque push et sur chaque PR : une PR qui
      # casse le Dockerfile est detectee avant le merge. Le push vers le
      # registre, lui, reste reserve a master.
      - name: Build de l image Docker (push uniquement sur master)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
