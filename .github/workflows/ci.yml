# Pipeline CI/CD - Ressources Relationnelles (Symfony 7.3)
# Phases : Build  >  Tests  >  Deploy
#
# A placer dans le depot : .github/workflows/ci.yml
# Le job "deploy" est volontairement desactive tant que le serveur cible
# n'est pas provisionne : decommentez et renseignez les secrets GitHub
# (Settings > Secrets and variables > Actions) pour l'activer.

name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------- BUILD
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, intl, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Cache des dependances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Installation des dependances PHP
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build des assets front (Webpack Encore)
        run: |
          npm ci
          npm run build

  # ----------------------------------------------------------------- TESTS
  tests:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest
    needs: build
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: projet_co_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: test
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/projet_co_test?serverVersion=8.0"
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, intl, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Installation des dependances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build des assets front (Webpack Encore)
        run: |
          npm ci
          npm run build

      - name: Generation des cles JWT (test)
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --env=test || true

      - name: Creation du schema de base de test
        run: php bin/console doctrine:schema:create --env=test

      - name: Execution de la suite de tests
        run: php bin/phpunit

  # ----------------------------------------------------------------- DOCKER
  docker:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # GHCR n'accepte que des noms d'image en minuscules, or le proprietaire
      # du depot contient des majuscules (EbubekirGuldal).
      - name: Nom de l image en minuscules
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Connexion au GitHub Container Registry
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # L image est construite a chaque push et sur chaque PR : une PR qui
      # casse le Dockerfile est detectee avant le merge. Le push vers le
      # registre, lui, reste reserve a master.
      - name: Build de l image Docker (push uniquement sur master)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
